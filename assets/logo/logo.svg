<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C068" />
      <stop offset="50%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#9E7622" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C068" />
      <stop offset="100%" stop-color="#C89B3C" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(4, 8)">
    <!-- Base geometric structure -->
    <path d="M4 48 L28 12 L52 48 Z" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 48 L28 30 L40 48" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Modern architectural tower accent -->
    <rect x="24" y="2" width="8" height="22" rx="1.5" fill="url(#goldGradient)"/>
    <rect x="14" y="16" width="6" height="14" rx="1" fill="url(#goldGradient)" opacity="0.8"/>
    <rect x="36" y="16" width="6" height="14" rx="1" fill="url(#goldGradient)" opacity="0.8"/>
    
    <circle cx="28" cy="40" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- Text Brandmark -->
  <g transform="translate(68, 14)">
    <!-- DV PROPMART -->
    <text x="0" y="26" font-family="'Outfit', 'Poppins', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      DV <tspan fill="url(#goldGradient)">PROPMART</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="1" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="2.8">
      PREMIER REAL ESTATE CONSULTANCY
    </text>
  </g>
</svg>

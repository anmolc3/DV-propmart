<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequently Asked Questions (FAQ) | KV PropMart</title>
  <meta name="description"
    content="Find answers to common questions about buying, selling, site visits, home loans, RERA compliance, and commercial property investments with KV PropMart.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="FAQ | KV PropMart">
  <meta property="og:description"
    content="Answers to common real estate questions about buying, selling, and site visits in Delhi NCR.">
  <meta property="og:image" content="assets/images/about-consultation.webp">

        <!-- Floating WhatsApp Action -->
  <a href="https://wa.me/918800994453" target="_blank" rel="noopener" class="floating-whatsapp-btn" aria-label="Chat with KV PropMart on WhatsApp" data-config="whatsapp-action">
    <span class="wa-status-dot"></span>
    <img src="assets/icons/whatsapp.svg" alt="WhatsApp" class="wa-floating-icon">
  </a>

  <button class="back-to-top-btn" aria-label="Back to Top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Accordion interaction
    document.querySelectorAll(".faq-question").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".faq-item");
        const answer = item.querySelector(".faq-answer");
        const isActive = item.classList.contains("active");

        // Close others
        document.querySelectorAll(".faq-item").forEach(other => {
          if (other !== item) {
            other.classList.remove("active");
            other.querySelector(".faq-answer").style.maxHeight = null;
          }
        });

        if (isActive) {
          item.classList.remove("active");
          answer.style.maxHeight = null;
        } else {
          item.classList.add("active");
          answer.style.maxHeight = answer.scrollHeight + 30 + "px";
        }
      });
    });

    // Instant FAQ Search
    const searchInput = document.querySelector("#faqSearchInput");
    if (searchInput) {
      searchInput.addEventListener("input", () => {
        const term = searchInput.value.toLowerCase().trim();
        document.querySelectorAll(".faq-item").forEach(item => {
          const text = item.textContent.toLowerCase();
          if (text.includes(term)) {
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        });
      });
    }
  </script>
</body>

</html>
